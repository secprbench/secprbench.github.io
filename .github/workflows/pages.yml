name: Publish results website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Validate frozen data and public trajectories
        run: |
          python scripts/check_data.py
          python scripts/check_trajectories.py
      - run: npm run build
      - name: Validate independent deployment and size budget
        run: python scripts/check_site.py
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Test results, task annotations, and trajectories
        run: npx playwright test
      # Pages steps run only after the repository variable PAGES_ENABLED is set to
      # 'true' (Settings → Secrets and variables → Actions → Variables). Until then
      # the workflow validates and builds the site without deploying it.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
